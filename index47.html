<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>止痛药认知误区玫瑰图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:transparent;}
    #chart{width:100%;height:100%;}
  </style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
var dom = document.getElementById('chart');
var myChart = echarts.init(dom, null, {
  renderer: 'canvas',
  backgroundColor: 'transparent'
});

var data = [
  { value: 40.6, name: '止痛药吃了会上瘾', itemStyle: { color: '#C87486' } },
  { value: 47.1, name: '痛到极致才吃药效果才好', itemStyle: { color: '#8C6B94' } },
  { value: 60, name: '红糖水/热敷比吃药管用', itemStyle: { color: '#B4A0C8' } },
  { value: 50, name: '止痛药伤胃伤肾，能不吃就不吃', itemStyle: { color: '#E88A9A' } },
  { value: 30, name: '吃多了会耐药，以后就没用了', itemStyle: { color: '#D1C2E0' } }
];

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'item',
    formatter: '{b}<br/>持有比例：{c}%'
  },
  legend: {
    orient: 'vertical',
    right: 15,
    top: 'center',
    itemWidth: 14,
    itemHeight: 14,
    itemGap: 14,
    textStyle: {
      color: '#555',
      fontSize: 12,
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
    }
  },
  series: [
    {
      type: 'pie',
      radius: ['10%', '75%'],
      center: ['32%', '50%'],
      roseType: 'area',
      avoidLabelOverlap: true,
      itemStyle: {
        borderColor: '#fff',
        borderWidth: 3,
        borderRadius: 6
      },
      label: {
        show: true,
        color: '#fff',
        fontSize: 12,
        fontWeight: '700',
        fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
        formatter: '{c}%',
        position: 'inside'
      },
      labelLine: {
        show: false
      },
      emphasis: {
        scale: true,
        scaleSize: 6,
        itemStyle: {
          shadowBlur: 20,
          shadowColor: 'rgba(0,0,0,0.3)'
        }
      },
      data: data
    }
  ]
};

myChart.setOption(option);

window.addEventListener('resize', function () {
  myChart.resize();
});
</script>
</body>
</html>
