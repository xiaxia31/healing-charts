<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>html,body{height:100%;margin:0;background:transparent}#chart{width:100%;height:100%;background:transparent;position:relative;}</style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'), null, { renderer:'canvas' });

const data = [
  { value: 40.6, name: '止痛药成瘾恐惧' },
  { value: 50, name: '胃肠道不良反应担忧' },
  { value: 40, name: '肝肾损伤担忧' },
  { value: 30, name: '耐药性/越吃越没用' },
  { value: 65, name: '备孕期/怀孕不敢用药' },
  { value: 60, name: '哺乳期不敢用药' },
  { value: 40.6, name: '月经期用药顾虑' }
];

const order = [...data].sort((a, b) => a.value - b.value);

const colors = ['#F2C8D0', '#D1C2E0', '#E88A9A', '#E4C7B1', '#B4A0C8', '#8C6B94', '#C87486'];

let inner = 5;
const radiusList = order.map((d, i) => {
  const outer = inner + d.value * 0.15;
  const r = [inner + '%', outer + '%'];
  inner = outer + 1.5;
  return r;
});

const series = order.map((d, i) => ({
  type: 'pie',
  radius: radiusList[i],
  center: ['55%', '60%'],
  startAngle: 180,
  endAngle: 0,
  label: {
    show: true,
    position: 'inside',
    fontSize: 11,
    fontWeight: 'bold',
    color: '#000',
    formatter: '{c}%',
    fontFamily: 'Arial, sans-serif'
  },
  labelLine: { show: false },
  itemStyle: { color: colors[i] },
  data: [
    d,
    { value: 100 - d.value, itemStyle: { color: 'transparent' }, tooltip: { show: false }, label: { show: false } }
  ]
}));

chart.setOption({
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'item',
    formatter: (p) => p.data.name + '：' + p.data.value + '%'
  },
  legend: {
    orient: 'vertical',
    left: 10,
    top: 'middle',
    itemWidth: 16,
    itemHeight: 12,
    itemGap: 12,
    textStyle: {
      color: '#000',
      fontSize: 12,
      fontWeight: '500',
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
    },
    data: order.slice().reverse().map(function(d, i) {
      return {
        name: d.name,
        itemStyle: { color: colors[order.length - 1 - i] }
      };
    })
  },
  series
});

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
