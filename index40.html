<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .chart-wrap { position: relative; width: 480px; height: 470px; }
  svg { display: block; }
  .person-icon { transition: opacity 0.2s; cursor: pointer; }
  .person-icon.dim { opacity: 0.12; }
  .person-icon.bright { opacity: 1; }
  .tooltip {
    position: absolute;
    background: rgba(30,20,30,0.92);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: #fff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    white-space: nowrap;
    z-index: 10;
    line-height: 1.5;
  }
  .tooltip .tt-cat { font-size: 13px; font-weight: bold; }
  .tooltip .tt-val { font-size: 13px; font-weight: bold; color: #F2C8D0; margin-top: 2px; }
</style>
</head>
<body style="background:transparent;">
<div class="chart-wrap">
<svg width="480" height="470" xmlns="http://www.w3.org/2000/svg" id="chartSvg">
  <defs>
    <symbol id="person" viewBox="0 0 24 24">
      <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
    </symbol>
  </defs>
</svg>
<div class="tooltip" id="tooltip"></div>
</div>
<script>
(function() {
  const fillColor = ['#C87486', '#8C6B94'];
  const emptyColor = '#e8e4e8';
  const data = [
    { group: '城市育龄女性', metric: '主动就医率', value: 21.2, colorIdx: 0 },
    { group: '城市育龄女性', metric: '正确知识获取', value: 69.2, colorIdx: 1 },
    { group: '农村育龄女性', metric: '主动就医率', value: 9.7, colorIdx: 0 },
    { group: '农村育龄女性', metric: '正确知识获取', value: 32.7, colorIdx: 1 }
  ];

  const svg = document.getElementById('chartSvg');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const cellSize = 11;
  const iconSize = 10;
  const gridCols = 5;
  const gridRows = 20;
  const gridHeight = gridRows * cellSize; // 220px, about half of 470
  const gridTop = (470 - gridHeight) / 2; // centered vertically
  const colWidth = gridCols * cellSize;
  const colGap = 24;
  const groupGap = 56;
  const startX = 44;
  const tooltip = document.getElementById('tooltip');
  const allIcons = [];

  // Legend at top
  var legendG = document.createElementNS(SVG_NS, 'g');
  legendG.setAttribute('transform', 'translate(65, 20)');

  var lg1 = document.createElementNS(SVG_NS, 'use');
  lg1.setAttribute('href', '#person');
  lg1.setAttribute('x', '0');
  lg1.setAttribute('y', '0');
  lg1.setAttribute('width', '14');
  lg1.setAttribute('height', '14');
  lg1.setAttribute('fill', '#C87486');
  legendG.appendChild(lg1);

  var lt1 = document.createElementNS(SVG_NS, 'text');
  lt1.setAttribute('x', '20');
  lt1.setAttribute('y', '11');
  lt1.setAttribute('font-size', '12');
  lt1.setAttribute('fill', '#555');
  lt1.setAttribute('font-family', 'PingFang SC, Microsoft YaHei, sans-serif');
  lt1.textContent = '主动就医率';
  legendG.appendChild(lt1);

  var lg2 = document.createElementNS(SVG_NS, 'use');
  lg2.setAttribute('href', '#person');
  lg2.setAttribute('x', '115');
  lg2.setAttribute('y', '0');
  lg2.setAttribute('width', '14');
  lg2.setAttribute('height', '14');
  lg2.setAttribute('fill', '#8C6B94');
  legendG.appendChild(lg2);

  var lt2 = document.createElementNS(SVG_NS, 'text');
  lt2.setAttribute('x', '135');
  lt2.setAttribute('y', '11');
  lt2.setAttribute('font-size', '12');
  lt2.setAttribute('fill', '#555');
  lt2.setAttribute('font-family', 'PingFang SC, Microsoft YaHei, sans-serif');
  lt2.textContent = '正确知识获取';
  legendG.appendChild(lt2);

  var lg3 = document.createElementNS(SVG_NS, 'use');
  lg3.setAttribute('href', '#person');
  lg3.setAttribute('x', '255');
  lg3.setAttribute('y', '0');
  lg3.setAttribute('width', '14');
  lg3.setAttribute('height', '14');
  lg3.setAttribute('fill', '#ddd');
  legendG.appendChild(lg3);

  var lt3 = document.createElementNS(SVG_NS, 'text');
  lt3.setAttribute('x', '275');
  lt3.setAttribute('y', '11');
  lt3.setAttribute('font-size', '12');
  lt3.setAttribute('fill', '#555');
  lt3.setAttribute('font-family', 'PingFang SC, Microsoft YaHei, sans-serif');
  lt3.textContent = '其他';
  legendG.appendChild(lt3);

  svg.appendChild(legendG);

  const groupLabels = ['城市育龄女性', '农村育龄女性'];

  groupLabels.forEach(function(groupName, gi) {
    const groupData = data.filter(function(d) { return d.group === groupName; });
    const groupX = startX + gi * (2 * colWidth + colGap + groupGap);

    // Group label
    var groupLabel = document.createElementNS(SVG_NS, 'text');
    groupLabel.setAttribute('x', groupX + colWidth + colGap / 2);
    groupLabel.setAttribute('y', gridTop - 16);
    groupLabel.setAttribute('text-anchor', 'middle');
    groupLabel.setAttribute('font-size', '13');
    groupLabel.setAttribute('fill', '#333');
    groupLabel.setAttribute('font-weight', '600');
    groupLabel.setAttribute('font-family', 'PingFang SC, Microsoft YaHei, sans-serif');
    groupLabel.textContent = groupName;
    svg.appendChild(groupLabel);

    groupData.forEach(function(cat, ci) {
      const colX = groupX + ci * (colWidth + colGap);
      const fillCount = Math.round(cat.value);

      for (var i = 0; i < 100; i++) {
        var r = Math.floor(i / gridCols);
        var c = i % gridCols;
        var x = colX + c * cellSize + (cellSize - iconSize) / 2;
        var y = gridTop + (gridRows - 1 - r) * cellSize + (cellSize - iconSize) / 2;

        var isFilled = i < fillCount;
        var color = isFilled ? fillColor[cat.colorIdx] : emptyColor;

        var use = document.createElementNS(SVG_NS, 'use');
        use.setAttribute('href', '#person');
        use.setAttribute('x', x);
        use.setAttribute('y', y);
        use.setAttribute('width', iconSize);
        use.setAttribute('height', iconSize);
        use.setAttribute('fill', color);
        use.setAttribute('class', 'person-icon');
        use.setAttribute('data-group', gi);
        use.setAttribute('data-col', ci);
        use.setAttribute('data-filled', isFilled ? '1' : '0');
        use.setAttribute('data-groupname', groupName);
        use.setAttribute('data-metric', cat.metric);
        use.setAttribute('data-value', cat.value);

        use.addEventListener('mouseenter', function(e) {
          var dgroup = parseInt(this.getAttribute('data-group'));
          var dcol = parseInt(this.getAttribute('data-col'));
          var dfilled = this.getAttribute('data-filled') === '1';
          var dgroupname = this.getAttribute('data-groupname');
          var dmetric = this.getAttribute('data-metric');
          var dvalue = this.getAttribute('data-value');

          allIcons.forEach(function(ic) {
            var icGroup = parseInt(ic.getAttribute('data-group'));
            var icCol = parseInt(ic.getAttribute('data-col'));
            var icFilled = ic.getAttribute('data-filled') === '1';
            if (icGroup === dgroup && icCol === dcol && icFilled) {
              ic.classList.add('bright');
              ic.classList.remove('dim');
            } else {
              ic.classList.add('dim');
              ic.classList.remove('bright');
            }
          });

          tooltip.innerHTML = '<div class="tt-cat">' + dgroupname + '</div><div>' + dmetric + '</div><div class="tt-val">' + dvalue + '%</div>';
          tooltip.style.opacity = '1';
        });
        use.addEventListener('mousemove', function(e) {
          var rect = document.querySelector('.chart-wrap').getBoundingClientRect();
          tooltip.style.left = (e.clientX - rect.left + 12) + 'px';
          tooltip.style.top = (e.clientY - rect.top - 60) + 'px';
        });
        use.addEventListener('mouseleave', function(e) {
          allIcons.forEach(function(ic) { ic.classList.remove('dim', 'bright'); });
          tooltip.style.opacity = '0';
        });

        svg.appendChild(use);
        allIcons.push(use);
      }

      // Metric label
      var label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', colX + colWidth / 2);
      label.setAttribute('y', gridTop + gridHeight + 20);
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-size', '11');
      label.setAttribute('fill', '#666');
      label.setAttribute('font-family', 'PingFang SC, Microsoft YaHei, sans-serif');
      label.textContent = cat.metric;
      svg.appendChild(label);

      // Value label
      var valLabel = document.createElementNS(SVG_NS, 'text');
      valLabel.setAttribute('x', colX + colWidth / 2);
      valLabel.setAttribute('y', gridTop + gridHeight + 40);
      valLabel.setAttribute('text-anchor', 'middle');
      valLabel.setAttribute('font-size', '14');
      valLabel.setAttribute('fill', fillColor[cat.colorIdx]);
      valLabel.setAttribute('font-weight', '700');
      valLabel.setAttribute('font-family', 'Arial, sans-serif');
      valLabel.textContent = cat.value + '%';
      svg.appendChild(valLabel);
    });
  });
})();
</script>
</body>
</html>
