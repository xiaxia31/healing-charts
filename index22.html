<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
html,body{margin:0;background:transparent;}
#chart { width:100%; height:560px; background:transparent; }
</style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
const myChart = echarts.init(document.getElementById('chart'), null, { renderer:'canvas' });
//行：满意度；列：消费渠道
const yLabel = ["很不满意","不满意","一般","比较满意","非常满意"]
const xLabel = [
  '美食（火锅、零食）',
  '影视/演出/展览',
  '旅行/短途度假',
  '文创/手办/毛绒配饰',
  '户外运动（露营、骑行）',
  '睡眠/康养服务',
  '其他'
]
// [很不满意，不满意，一般，比较满意，非常满意]
const raw = [
  [1.20, 6.00, 48.80, 44.00, 0],
  [1.20, 12.35, 46.39, 40.06, 0],
  [0.24, 1.93, 14.46, 36.39, 46.99],
  [0.25, 4.69, 17.04, 39.01, 39.01],
  [1.21, 2.43, 10.93, 43.32, 42.11],
  [1.20, 20.48, 30.12, 46.99, 0],
  [0, 0, 50.00, 0, 50.00]
]
//转换热力图data格式 [xIndex,yIndex,value]
let heatData = [];
for(let x=0;x<raw.length;x++){
  for(let y=0;y<raw[x].length;y++){
    heatData.push([x,y,raw[x][y]])
  }
}

const option = {
  backgroundColor: 'transparent',
  tooltip:{
    formatter:(p)=>`渠道：${xLabel[p.data[0]]}<br/>${yLabel[p.data[1]]}：${p.data[2]}%`
  },
  visualMap:{
    min:0,
    max:50,
    calculable:true,
    orient:'horizontal',
    left:'center',
    bottom:'2%',
    //颜色顺序反转：低值→高值：#6b8cae → #7ba687 → #d4a95a → #c9785c
    inRange:{
      color:['#f7f2ef','#6b8cae','#7ba687','#d4a95a','#c9785c']
    }
  },
  grid:{left:'12%',right:'5%',top:'10%',bottom:'26%'},
  xAxis:{
    type:'category',
    data:xLabel,
    axisLabel:{rotate:30, margin:8}
  },
  yAxis:{
    type:'category',
    data:yLabel
  },
  series:[
    {
      type:'heatmap',
      data:heatData,
      label:{show:true,fontSize:11},
      itemStyle:{borderColor:'#fff',borderWidth:2}
    }
  ]
}
myChart.setOption(option);
window.addEventListener('resize',()=>myChart.resize())
</script>
</body>
</html>
