<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>慢性疼痛疾病确诊时间面积图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:transparent;}
    .chart-wrap{width:100%;height:100%;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;}
    .chart-item{width:calc(50% - 8px);height:calc(50% - 8px);}
  </style>
</head>
<body style="background:transparent;">
<div class="chart-wrap">
  <div class="chart-item" id="c1"></div>
  <div class="chart-item" id="c2"></div>
  <div class="chart-item" id="c3"></div>
  <div class="chart-item" id="c4"></div>
</div>
<script>
var data = [
  { name: '子宫内膜异位症', value: 7.5, label: '7.5年', color: '#C87486' },
  { name: '纤维肌痛', value: 2, label: '2年以上', color: '#8C6B94' },
  { name: '慢性盆腔痛', value: 2, label: '2年以上', color: '#B4A0C8' },
  { name: '慢性疼痛(总体)', value: 5, label: '5年以上', color: '#E88A9A' }
];

var colors = ['#C87486', '#8C6B94', '#B4A0C8', '#E88A9A'];

function genAreaData(targetVal) {
  var points = 12;
  var arr = [];
  for (var i = 0; i < points; i++) {
    var t = i / (points - 1);
    var base = targetVal * (1 - Math.pow(1 - t, 1.5));
    var noise = (Math.sin(i * 1.3) * 0.15 + Math.cos(i * 0.7) * 0.1) * targetVal;
    var val = Math.max(0, base + noise);
    arr.push(Number(val.toFixed(1)));
  }
  arr[arr.length - 1] = targetVal;
  return arr;
}

data.forEach(function(d, idx) {
  var chart = echarts.init(document.getElementById('c' + (idx+1)), null, {
    renderer: 'canvas',
    backgroundColor: 'transparent'
  });

  var areaData = genAreaData(d.value);
  var xLabels = areaData.map(function(_, i) { return i+1; });

  var option = {
    backgroundColor: 'transparent',
    grid: { left: 0, right: 0, top: 10, bottom: 0 },
    xAxis: {
      type: 'category',
      data: xLabels,
      show: false
    },
    yAxis: {
      type: 'value',
      show: false,
      min: 0,
      max: Math.max(8, d.value * 1.3)
    },
    tooltip: {
      trigger: 'axis',
      show: false
    },
    series: [
      {
        type: 'line',
        data: areaData,
        smooth: true,
        symbol: 'none',
        lineStyle: {
          width: 2.5,
          color: d.color
        },
        areaStyle: {
          color: {
            type: 'linear',
            x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: d.color + 'cc' },
              { offset: 0.5, color: d.color + '55' },
              { offset: 1, color: d.color + '08' }
            ]
          }
        }
      }
    ],
    graphic: [
      {
        type: 'text',
        left: 'center',
        top: 8,
        style: {
          text: d.name,
          fill: '#333',
          fontSize: 13,
          fontWeight: '600',
          fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
        }
      },
      {
        type: 'text',
        right: 10,
        bottom: 12,
        style: {
          text: d.label,
          fill: d.color,
          fontSize: 20,
          fontWeight: '700',
          fontFamily: 'Arial, sans-serif'
        }
      }
    ]
  };

  chart.setOption(option);

  window.addEventListener('resize', function () {
    chart.resize();
  });
});
</script>
</body>
</html>
