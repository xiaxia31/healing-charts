<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
#wrap{
  position:relative;
  width:100%;
  height:470px;
}
.timeline-box{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  z-index:3;
}
.timeline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  padding:10px 0;
}
.timeline::before{
  content:"";
  position:absolute;
  top:16px;
  left:8%;
  right:8%;
  height:3px;
  background:linear-gradient(to right, rgba(200,116,134,0.35), rgba(140,107,148,0.7), rgba(200,116,134,0.35));
  border-radius:3px;
  z-index:0;
}
.timeline-item{
  cursor:pointer;
  text-align:center;
  position:relative;
  z-index:1;
  flex:1;
}
.timeline-dot{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#f8eef0;
  border:3px solid #C87486;
  margin:0 auto 6px;
  transition:0.25s;
}
.timeline-item.active .timeline-dot{
  background:#C87486;
  transform:scale(1.25);
  box-shadow:0 0 0 6px rgba(200,116,134,0.22);
}
.timeline-label{
  font-size:13px;
  font-weight:700;
  color:#8C6B94;
  background:rgba(255,255,255,0.5);
  padding:3px 8px;
  border-radius:6px;
}
.timeline-item.active .timeline-label{
  color:#fff;
  background:#8C6B94;
}
.data-panel{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.32);
  border:1px solid rgba(255,255,255,0.45);
  padding:10px 20px;
  border-radius:12px;
  color:#4a3a50;
  font-size:12px;
  line-height:1.5;
  display:flex;
  gap:20px;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  z-index:2;
}
.data-panel .block{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.data-panel .label{
  font-size:11px;
  color:#665570;
  margin-bottom:2px;
}
.data-panel .value{
  font-size:22px;
  font-weight:800;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  line-height:1.1;
}
.data-panel .value.drug{
  color:#C87486;
}
.data-panel .value.nondrug{
  color:#8C6B94;
}
.data-panel .value small{
  font-size:12px;
  font-weight:600;
  margin-left:2px;
}
.data-panel .divider{
  width:1px;
  height:28px;
  background:rgba(140,107,148,0.3);
}
</style>
</head>
<body style="margin:0;background:transparent;">
<div id="wrap">
  <div class="timeline-box">
    <div class="timeline" id="timelineEl"></div>
  </div>
  <div id="chart" style="width:100%;height:100%;"></div>
  <div class="data-panel" id="infoPanel"></div>
</div>
<script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
<script>
var chartDom = document.getElementById('chart');
var myChart = echarts.init(chartDom, null, {renderer: 'canvas'});
var infoPanel = document.getElementById('infoPanel');
var timelineEl = document.getElementById('timelineEl');

var rawData = [
  {year:2022, drug:64, nondrug:36},
  {year:2023, drug:60, nondrug:40},
  {year:2024, drug:56, nondrug:44},
  {year:2025, drug:52, nondrug:48}
];
var dataIndex = 0;
var timer = null;

function startAutoPlay(){
  timer = setInterval(function () {
    dataIndex++;
    if (dataIndex >= rawData.length) dataIndex = 0;
    renderCurrent();
  }, 1500);
}
function stopAutoPlay(){
  clearInterval(timer);
}

function renderCurrent(){
  var curr = rawData[dataIndex];
  updateInfoPanel();
  myChart.setOption({
    series: [
      {data: makePillData(curr.drug, true)},
      {data: makePillData(curr.nondrug, false)}
    ]
  });
  var items = document.querySelectorAll('.timeline-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', i === dataIndex);
  }
}

for (var idx = 0; idx < rawData.length; idx++) {
  (function(i){
    var item = rawData[i];
    var div = document.createElement('div');
    div.className = 'timeline-item';
    div.innerHTML = '<div class="timeline-dot"></div><div class="timeline-label">' + item.year + '</div>';
    div.onclick = function(){
      stopAutoPlay();
      dataIndex = i;
      renderCurrent();
    };
    timelineEl.appendChild(div);
  })(idx);
}

function updateInfoPanel(){
  var curr = rawData[dataIndex];
  infoPanel.innerHTML =
    '<div class="block"><div class="label">年份</div><div class="value" style="color:#555;">' + curr.year + '</div></div>' +
    '<div class="divider"></div>' +
    '<div class="block"><div class="label">痛经药占比</div><div class="value drug">' + curr.drug + '<small>%</small></div></div>' +
    '<div class="divider"></div>' +
    '<div class="block"><div class="label">非止痛调理类</div><div class="value nondrug">' + curr.nondrug + '<small>%</small></div></div>';
}

// 胶囊象形图：左右对称分布
function makePillData(val, isLeft) {
  var rows = 8;
  var maxVal = 64;
  var totalPills = Math.round(val / maxVal * 40);
  var data = [];
  for (var i = 0; i < rows; i++) {
    var perRow = Math.ceil(totalPills / rows);
    var sign = isLeft ? -1 : 1;
    var baseWidth = perRow * 18;
    var offset = (i % 2) * 9;
    var obj = {
      value: sign * baseWidth,
      symbolOffset: [sign * offset + '%', 0]
    };
    data.push(obj);
  }
  return data;
}

var option = {
  backgroundColor: 'transparent',
  tooltip:{
    trigger:'item',
    formatter:function(params){
      var curr = rawData[dataIndex];
      return curr.year + '年<br/>痛经药：' + curr.drug + '%<br/>非止痛调理类：' + curr.nondrug + '%';
    }
  },
  xAxis: {
    axisLine: { show: false },
    axisLabel: { show: false },
    axisTick: { show: false },
    splitLine: { show: false },
    min: -200,
    max: 200
  },
  yAxis: {
    type: 'category',
    data: ['a','b','c','d','e','f','g','h'],
    show: false
  },
  grid: {
    top: 80,
    bottom: 100,
    left: 'center',
    width: 350
  },
  series: [
    {
      name: '痛经药',
      type: 'pictorialBar',
      symbol: 'roundRect',
      symbolSize: [16, 20],
      symbolRepeat: true,
      symbolMargin: 3,
      itemStyle: { color: '#C87486' },
      data: makePillData(rawData[0].drug, true),
      animationEasing: 'elasticOut',
      animationDuration: 800
    },
    {
      name: '非止痛调理类',
      type: 'pictorialBar',
      symbol: 'roundRect',
      symbolSize: [16, 20],
      symbolRepeat: true,
      symbolMargin: 3,
      itemStyle: { color: '#8C6B94' },
      data: makePillData(rawData[0].nondrug, false),
      animationEasing: 'elasticOut',
      animationDuration: 800
    }
  ],
  graphic: [
    {
      type: 'text',
      left: '30%',
      top: 220,
      style: {
        text: '痛经药',
        fill: '#C87486',
        fontSize: 14,
        fontWeight: '700',
        fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
        textAlign: 'center'
      }
    },
    {
      type: 'text',
      left: '70%',
      top: 220,
      style: {
        text: '非止痛调理类',
        fill: '#8C6B94',
        fontSize: 14,
        fontWeight: '700',
        fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
        textAlign: 'center'
      }
    }
  ]
};

myChart.setOption(option);
renderCurrent();
startAutoPlay();

window.addEventListener('resize',function(){
  myChart.resize();
});
</script>
</body>
</html>
