<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>分娩镇痛普及率趋势</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:transparent;}
    #chart{width:100%;height:100%;}
  </style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
var dom = document.getElementById('chart');
var myChart = echarts.init(dom, null, {
  renderer: 'canvas',
  backgroundColor: 'transparent'
});

var years = ['2018','2019','2020','2021','2022','2023','2024','2025','2026','2027'];
var people = [97, 132, 151, 185, 228, 235, 241, 246, 251, 254];
var rate = [10, 13, 17, 23, 30, 34, 38, 43, 49, 55];

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'axis',
    axisPointer: { type: 'cross' },
    formatter: function(params) {
      var html = params[0].axisValue + '<br/>';
      params.forEach(function(p) {
        var unit = p.seriesName === '用药人数' ? ' 万人' : '%';
        html += p.marker + p.seriesName + '：' + p.value + unit + '<br/>';
      });
      return html;
    }
  },
  legend: {
    data: ['用药人数', '普及率'],
    top: 10,
    textStyle: {
      color: '#555',
      fontSize: 13,
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
    }
  },
  grid: {
    left: 60,
    right: 60,
    top: 60,
    bottom: 40
  },
  xAxis: {
    type: 'category',
    data: years,
    axisLine: { lineStyle: { color: '#ccc' } },
    axisTick: { show: false },
    axisLabel: {
      color: '#666',
      fontSize: 12,
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
    }
  },
  yAxis: [
    {
      type: 'value',
      name: '万人',
      nameTextStyle: { color: '#999', fontSize: 11 },
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: 'rgba(200,200,200,0.2)' } },
      axisLabel: { color: '#999', fontSize: 11 }
    },
    {
      type: 'value',
      name: '普及率',
      nameTextStyle: { color: '#999', fontSize: 11 },
      min: 0,
      max: 60,
      axisLine: { show: false },
      axisTick: { show: false },
      splitLine: { show: false },
      axisLabel: { color: '#999', fontSize: 11, formatter: '{value}%' }
    }
  ],
  series: [
    {
      name: '用药人数',
      type: 'bar',
      yAxisIndex: 0,
      data: people,
      barWidth: '50%',
      itemStyle: {
        color: {
          type: 'linear',
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: '#C87486' },
            { offset: 1, color: '#E88A9A' }
          ]
        },
        borderRadius: [4, 4, 0, 0]
      }
    },
    {
      name: '普及率',
      type: 'line',
      yAxisIndex: 1,
      data: rate,
      smooth: true,
      symbol: 'circle',
      symbolSize: 8,
      lineStyle: {
        width: 3,
        color: '#8C6B94'
      },
      itemStyle: {
        color: '#8C6B94',
        borderColor: '#fff',
        borderWidth: 2
      },
      areaStyle: {
        color: {
          type: 'linear',
          x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: 'rgba(140,107,148,0.3)' },
            { offset: 1, color: 'rgba(140,107,148,0.02)' }
          ]
        }
      },
      label: {
        show: true,
        position: 'top',
        color: '#8C6B94',
        fontSize: 11,
        fontWeight: '600',
        formatter: '{c}%'
      }
    }
  ]
};

myChart.setOption(option);

window.addEventListener('resize', function () {
  myChart.resize();
});
</script>
</body>
</html>
