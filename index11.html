<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
#treeWrap{
  position:relative;
  width:100%;
  height:480px;
}
.timeline-box{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:86%;
  z-index:3;
}
.timeline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  padding:10px 0;
}
.timeline::before{
  content:"";
  position:absolute;
  top:16px;
  left:6%;
  right:6%;
  height:3px;
  background:linear-gradient(to right, rgba(72,156,103,0.35), rgba(72,156,103,0.7), rgba(72,156,103,0.35));
  border-radius:3px;
  z-index:0;
}
.timeline-item{
  cursor:pointer;
  text-align:center;
  position:relative;
  z-index:1;
  flex:1;
}
.timeline-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#eaf7ef;
  border:3px solid #489c67;
  margin:0 auto 6px;
  transition:0.25s;
}
.timeline-item.active .timeline-dot{
  background:#489c67;
  transform:scale(1.25);
  box-shadow:0 0 0 6px rgba(72,156,103,0.22);
}
.timeline-label{
  font-size:14px;
  font-weight:700;
  color:#2f7a4a;
  background:rgba(255,255,255,0.5);
  padding:3px 8px;
  border-radius:6px;
}
.timeline-item.active .timeline-label{
  color:#fff;
  background:#489c67;
}
.data-panel{
  position:absolute;
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.32);
  border:1px solid rgba(255,255,255,0.45);
  padding:8px 16px;
  border-radius:12px;
  color:#144728;
  font-size:12px;
  line-height:1.5;
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
  z-index:2;
}
.data-panel .block{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.data-panel .label{
  font-size:11px;
  color:#3d6b50;
  margin-bottom:1px;
}
.data-panel .value{
  font-size:20px;
  font-weight:800;
  color:#0f3d22;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  line-height:1.1;
}
.data-panel .value small{
  font-size:12px;
  font-weight:600;
  color:#2f7a4a;
  margin-left:2px;
}
.data-panel .divider{
  width:1px;
  height:22px;
  background:rgba(47,122,74,0.35);
}
</style>
</head>
<body style="margin:0;background:transparent;">
<div id="treeWrap">
  <div class="timeline-box">
    <div class="timeline" id="timelineEl"></div>
  </div>
  <div id="treeChart" style="width:100%;height:100%;"></div>
  <div class="data-panel" id="infoPanel"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
var chartDom = document.getElementById('treeChart');
var myChart = echarts.init(chartDom, null, {renderer: 'canvas'});
var infoPanel = document.getElementById('infoPanel');
var timelineEl = document.getElementById('timelineEl');

var treeDataURI =
  'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAA2CAYAAADUOvnEAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAGXRFWHRTb2Z0d2FyZQBBZG9iZSBJbWFnZVJlYWR5ccllPAAAA5tJREFUeNrcWE1oE0EUnp0kbWyUpCiNYEpCFSpIMdpLRTD15s2ePHixnj00N4/GoyfTg2fbiwdvvagHC1UQ66GQUIQKKgn1UAqSSFua38b3prPJZDs7s5ufKn0w7CaZ2W/fe9/73kyMRqNB3Nrj1zdn4RJ6du9T2u1a2iHYSxjP4d41oOHGQwAIwSUHIyh8/RA8XeiXh0kLGFoaXiTecw/hoTG4ZCSAaFkY0+BpsZceLtiAoV2FkepZSDk5EpppczBvpuuQCqx0YnkYcVVoqQYMyeCG+lFdaGkXeVOFNu4aEBalOBk6sbQrQF7gSdK5JXjuHXuYVIVyr0TZ0FjKDeCs6km7JYMUdrWAUVmZUBtmRnVPK+x6nIR2xomH06R35ggwJPeofWphr/W5UjPIxq8B2bKgE8C4HVHWvg+2gZjXj19PkdFztY7bk9TDCH/g6oafDPpaoMvZIRI5WyMB/0Hv++HkpTKE0kM+A+h20cPAfN4GuRyp9G+LMTW+z8rCLI8b46XO9zRcYZTde/j0AZm8WGb3Y2F9KLlE2nqYkjFLJAsDOl/lea0q55mqxXcL7YBc++bsCPMe8mUyU2ZIpnCoblca6TZA/ga2Co8PGg7UGUlEDd0ueptglbrRZLLE7poti6pCaWUo2pu1oaYI1CF9b9cCZPO3F8ikJQ/rPpQT5YETht26ss+uCIL2Y8vHwJGpA96GI5mjOlaKhowUy6BcNcgIhDviTGWCGFaqEuufWz4pgcbCh+w0gEOyOjTlTtYYlIWPYWKEsLDzOs+nhzaO1KEpd+MXpOoTUgKiNyhdy5aSMPNVqxtSsJFgza5EWA4zKtCJ2OGbLn0JSLu8+SL4G86p1Fpr7ABXdGFF/UTD4rfmFYFw4G9VAJ9SM3aF8l3yok4/J6IV9sDVb36ynmtJ2M5+CwxTYBdKNMBaocKGV2nYgkz6r+cHBP30MzAfi4Sy+BebSoPIOi8PW1PpCCvr/KOD4k9Zu0WSH0Y0+SxJ2awp/nlwKtcGyHOJ8vNHtRJzhPlsHr8MogtlVtwUU0tSM1x58upSKbfJnSKUR07GVMKkDNfXpzpv0RTHy3nZMVx5IOWdZIaPabGFvfpwpjnvfmJHXLaEvZUTseu/TeLc+xgAPhEAb/PbjO6PBaOTf6LQRh/dERde23zxLtOXbaKNhfq2L/1fAOPHDUhOpIf5485h7l+GNHHiSYPKE3Myz9sFxoJuAyazvwIMAItferha5LTqAAAAAElFTkSuQmCC';

var rawData = [
  {year:2021, count:103, rate:0.3553},
  {year:2022, count:173, rate:0.6796},
  {year:2023, count:405, rate:1.3410},
  {year:2024, count:922, rate:1.2765},
  {year:2025, count:1362, rate:0.4772}
];
var dataIndex = 0;
var timer = null;

function startAutoPlay(){
  timer = setInterval(function () {
    dataIndex++;
    if (dataIndex >= rawData.length) {
      dataIndex = 0;
    }
    renderCurrent();
  }, 1200);
}
function stopAutoPlay(){
  clearInterval(timer);
}

function renderCurrent(){
  var curr = rawData[dataIndex];
  updateInfoPanel();
  myChart.setOption({
    series: [
      {data: makeSeriesData(curr.count, false)},
      {data: makeSeriesData(curr.count, true)}
    ]
  });
  var items = document.querySelectorAll('.timeline-item');
  for (var i = 0; i < items.length; i++) {
    if (i === dataIndex) {
      items[i].classList.add('active');
    } else {
      items[i].classList.remove('active');
    }
  }
}

for (var idx = 0; idx < rawData.length; idx++) {
  (function(i){
    var item = rawData[i];
    var div = document.createElement('div');
    div.className = 'timeline-item';
    div.innerHTML = '<div class="timeline-dot"></div><div class="timeline-label">' + item.year + '</div>';
    div.onclick = function(){
      stopAutoPlay();
      dataIndex = i;
      renderCurrent();
    };
    timelineEl.appendChild(div);
  })(idx);
}

function updateInfoPanel(){
  var curr = rawData[dataIndex];
  infoPanel.innerHTML =
    '<div class="block"><div class="label">年份</div><div class="value">' + curr.year + '</div></div>' +
    '<div class="divider"></div>' +
    '<div class="block"><div class="label">注册企业</div><div class="value">' + curr.count + '<small>家</small></div></div>' +
    '<div class="divider"></div>' +
    '<div class="block"><div class="label">同比增速</div><div class="value">' + (curr.rate*100).toFixed(2) + '%</div></div>';
}

function makeCategoryData() {
  var lineCount = 10;
  var categoryData = [];
  for (var i = 0; i < lineCount; i++) {
    categoryData.push(i + 'a');
  }
  return categoryData;
}

function makeSeriesData(countVal, negative) {
  var lineCount = 10;
  var maxCount = 1362;
  var scale = countVal / maxCount;
  var baseVal = Math.round(scale * 2800);
  var seriesData = [];
  for (var i = 0; i < lineCount; i++) {
    var sign = negative ? -1 : 1;
    var val = sign * Math.round(baseVal * ((lineCount - Math.abs(i - lineCount / 2 + 0.5)) / lineCount));
    var obj = { value: val };
    if (i % 2) { obj.symbolOffset = ['50%', 0]; }
    seriesData.push(obj);
  }
  return seriesData;
}

var option = {
  backgroundColor:'transparent',
  color: ['#489c67'],
  tooltip:{
    trigger:'item',
    formatter:function(params){
      var curr = rawData[dataIndex];
      return '年份：' + curr.year + '<br/>注册企业：' + curr.count + '家<br/>同比增速：' + (curr.rate*100).toFixed(2) + '%';
    }
  },
  xAxis: {
    axisLine: { show: false },
    axisLabel: { show: false },
    axisTick: { show: false },
    splitLine: { show: false },
    name: '',
    min: -2800,
    max: 2800
  },
  yAxis: {
    data: makeCategoryData(),
    show: false
  },
  grid: {
    top: 'center',
    height: 280
  },
  series: [
    {
      name: '企业数量',
      type: 'pictorialBar',
      symbol: 'image://' + treeDataURI,
      symbolSize: [30, 55],
      symbolRepeat: true,
      data: makeSeriesData(rawData[dataIndex].count, false),
      animationEasing: 'elasticOut'
    },
    {
      name: '企业数量',
      type: 'pictorialBar',
      symbol: 'image://' + treeDataURI,
      symbolSize: [30, 55],
      symbolRepeat: true,
      data: makeSeriesData(rawData[dataIndex].count, true),
      animationEasing: 'elasticOut'
    }
  ]
};
myChart.setOption(option);
renderCurrent();
startAutoPlay();

window.addEventListener('resize',function(){
  myChart.resize();
});
</script>
</body>
</html>
