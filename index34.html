<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女性疼痛认知率增长</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #chart-wrap{width:100%;height:200px;position:relative;}
  svg{display:block;}
  .bar-group{cursor:pointer;}
  .dim{opacity:0.25;}
  .tooltip{
    position:absolute;padding:5px 8px;background:rgba(30,20,30,0.92);color:#fff;
    font-size:11px;border-radius:4px;pointer-events:none;opacity:0;
    transition:opacity 0.2s;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    z-index:10;line-height:1.4;white-space:nowrap;
  }
  .tooltip .t-title{font-weight:700;font-size:12px;margin-bottom:1px;}
</style>
</head>
<body style="background:transparent;">
<div id="chart-wrap">
  <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" id="chartSvg"></svg>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
const data = [
  { year: '2015', value: 32, color: '#8C6B94', sub: '疼痛认知率' },
  { year: '2025', value: 70, color: '#C87486', sub: '疼痛认知率' }
];

const svg = document.getElementById('chartSvg');
const tooltip = document.getElementById('tooltip');
const wrap = document.getElementById('chart-wrap');

const cx1 = 72, cy = 105;
const cx2 = 228;
const R = 50;
const trackColor = '#f0e8ee';

function ringPath(cx, cy, r, startAngle, endAngle){
  const sx = cx + r * Math.cos(startAngle);
  const sy = cy + r * Math.sin(startAngle);
  const ex = cx + r * Math.cos(endAngle);
  const ey = cy + r * Math.sin(endAngle);
  const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
  return `M${sx},${sy} A${r},${r} 0 ${largeArc} 1 ${ex},${ey}`;
}

data.forEach((d, i) => {
  const cx = i === 0 ? cx1 : cx2;
  const startAngle = -Math.PI / 2;
  const valueAngle = startAngle + (d.value / 100) * Math.PI * 2;

  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.classList.add('bar-group');
  g.dataset.index = i;

  const track = document.createElementNS('http://www.w3.org/2000/svg','circle');
  track.setAttribute('cx', cx);
  track.setAttribute('cy', cy);
  track.setAttribute('r', R);
  track.setAttribute('fill', 'none');
  track.setAttribute('stroke', trackColor);
  track.setAttribute('stroke-width', '12');
  g.appendChild(track);

  const prog = document.createElementNS('http://www.w3.org/2000/svg','path');
  prog.setAttribute('d', ringPath(cx, cy, R, startAngle, valueAngle));
  prog.setAttribute('fill', 'none');
  prog.setAttribute('stroke', d.color);
  prog.setAttribute('stroke-width', '12');
  prog.setAttribute('stroke-linecap', 'round');
  prog.classList.add('ring-fill');
  g.appendChild(prog);

  const valText = document.createElementNS('http://www.w3.org/2000/svg','text');
  valText.setAttribute('x', cx);
  valText.setAttribute('y', cy - 2);
  valText.setAttribute('text-anchor','middle');
  valText.setAttribute('dominant-baseline','middle');
  valText.setAttribute('fill', d.color);
  valText.setAttribute('font-size','22');
  valText.setAttribute('font-family','Arial, sans-serif');
  valText.setAttribute('font-weight','800');
  valText.textContent = d.value + '%';
  g.appendChild(valText);

  const yearText = document.createElementNS('http://www.w3.org/2000/svg','text');
  yearText.setAttribute('x', cx);
  yearText.setAttribute('y', cy + 16);
  yearText.setAttribute('text-anchor','middle');
  yearText.setAttribute('dominant-baseline','middle');
  yearText.setAttribute('fill', '#6a5a6a');
  yearText.setAttribute('font-size','10');
  yearText.setAttribute('font-family','PingFang SC, Microsoft YaHei, sans-serif');
  yearText.setAttribute('font-weight','500');
  yearText.textContent = d.year;
  g.appendChild(yearText);

  svg.appendChild(g);
});

const midX = (cx1 + cx2) / 2;
const upY = 42;

const arrowG = document.createElementNS('http://www.w3.org/2000/svg','g');

const curve = document.createElementNS('http://www.w3.org/2000/svg','path');
curve.setAttribute('d', `M${cx1+R-5},${cy-2} Q${midX},${upY} ${cx2-R+5},${cy-2}`);
curve.setAttribute('fill','none');
curve.setAttribute('stroke','#C87486');
curve.setAttribute('stroke-width','2');
curve.setAttribute('stroke-dasharray','4,3');
curve.setAttribute('opacity','0.6');
arrowG.appendChild(curve);

const tri = document.createElementNS('http://www.w3.org/2000/svg','polygon');
tri.setAttribute('points', `${midX-1},${upY-6} ${midX+1},${upY-6} ${midX},${upY+2}`);
tri.setAttribute('fill', '#C87486');
arrowG.appendChild(tri);

const growth = document.createElementNS('http://www.w3.org/2000/svg','text');
growth.setAttribute('x', midX);
growth.setAttribute('y', upY - 14);
growth.setAttribute('text-anchor','middle');
growth.setAttribute('fill', '#C87486');
growth.setAttribute('font-size','13');
growth.setAttribute('font-family','Arial, sans-serif');
growth.setAttribute('font-weight','700');
growth.textContent = '+38%';
arrowG.appendChild(growth);

svg.appendChild(arrowG);

const groups = document.querySelectorAll('.bar-group');

groups.forEach(g => {
  g.addEventListener('mouseenter', e => {
    const idx = parseInt(g.dataset.index);
    groups.forEach((gr, i) => {
      if(i !== idx) gr.classList.add('dim');
    });
    const rect = wrap.getBoundingClientRect();
    const d = data[idx];
    tooltip.innerHTML = `<div class="t-title">${d.year}</div>女性疼痛认知率：${d.value}%`;
    tooltip.style.opacity = '1';
    tooltip.style.left = (e.clientX - rect.left + 8) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 8) + 'px';
  });
  g.addEventListener('mousemove', e => {
    const rect = wrap.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 8) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 8) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    groups.forEach(gr => gr.classList.remove('dim'));
    tooltip.style.opacity = '0';
  });
});
</script>
</body>
</html>
