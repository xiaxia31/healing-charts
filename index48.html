<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>痛经自我管理方式矩形树图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:transparent;}
    #chart{width:100%;height:100%;}
  </style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
var dom = document.getElementById('chart');
var myChart = echarts.init(dom, null, {
  renderer: 'canvas',
  backgroundColor: 'transparent'
});

var data = [
  { value: 47, name: '口服止痛药物\n（布洛芬等OTC止痛药）', itemStyle: { color: '#C87486' } },
  { value: 36, name: '外用热敷类\n（暖宫贴、痛经贴）', itemStyle: { color: '#8C6B94' } },
  { value: 12, name: '经期调理中成药\n（逍遥丸、益母草等）', itemStyle: { color: '#B4A0C8' } },
  { value: 5, name: '止痛器械\n（TENS痛经仪等）', itemStyle: { color: '#E88A9A' } }
];

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    formatter: function(params) {
      return params.name.replace(/\n/g, '') + '<br/>线上消费占比：' + params.value + '%';
    }
  },
  series: [{
    type: 'treemap',
    left: 0,
    right: 0,
    top: 0,
    bottom: 0,
    width: '100%',
    height: '100%',
    roam: false,
    nodeClick: false,
    breadcrumb: { show: false },
    label: {
      show: true,
      color: '#fff',
      fontSize: 14,
      fontWeight: '600',
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
      align: 'left',
      verticalAlign: 'top',
      offset: [12, 12]
    },
    upperLabel: { show: false },
    itemStyle: {
      borderColor: '#fff',
      borderWidth: 3,
      gapWidth: 3
    },
    emphasis: {
      itemStyle: {
        shadowBlur: 20,
        shadowColor: 'rgba(0,0,0,0.4)'
      },
      label: {
        fontSize: 16,
        fontWeight: '700'
      }
    },
    data: data
  }]
};

myChart.setOption(option);

window.addEventListener('resize', function () {
  myChart.resize();
});
</script>
</body>
</html>
