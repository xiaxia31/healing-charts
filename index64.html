<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>研发投入分布</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #wrap { width: 100%; height: 470px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="chart" style="width:100%;height:100%;"></div>
</div>
<script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
<script>
var chart = echarts.init(document.getElementById('chart'));

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'axis',
    axisPointer: { type: 'shadow' },
    formatter: function(params) {
      var total = 0;
      var res = params[0].name + '<br/>';
      params.forEach(function(item) {
        if (item.value) {
          total += item.value;
          res += item.marker + ' ' + item.seriesName + '：' + item.value + '%<br/>';
        }
      });
      res += '<b style="color:#C87486;">合计：' + total + '%</b>';
      return res;
    }
  },
  legend: {
    data: ['女性健康', '心血管', '肿瘤'],
    top: 20,
    icon: 'roundRect',
    itemWidth: 14,
    itemHeight: 10,
    itemGap: 20,
    textStyle: { color: '#4a3a50', fontSize: 12 }
  },
  grid: {
    left: '5%',
    right: '5%',
    bottom: '12%',
    top: '18%',
    containLabel: true
  },
  xAxis: {
    type: 'category',
    data: ['全球医药研发支出', '中国药企研发支出', '生物医药风投资金'],
    axisTick: { show: false },
    axisLine: { lineStyle: { color: '#d4ccd9' } },
    axisLabel: { color: '#665570', fontSize: 11, interval: 0 }
  },
  yAxis: {
    type: 'value',
    axisTick: { show: false },
    axisLine: { show: false },
    splitLine: { lineStyle: { color: '#ece7f0', type: 'dashed' } },
    axisLabel: { color: '#665570', formatter: '{value}%' }
  },
  series: [
    {
      name: '女性健康',
      type: 'bar',
      stack: 'total',
      barWidth: '40%',
      itemStyle: {
        color: '#C87486',
        borderRadius: [0, 0, 0, 0]
      },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(200,116,134,0.4)' } },
      data: [5.0, 2.5, 5.7]
    },
    {
      name: '心血管',
      type: 'bar',
      stack: 'total',
      barWidth: '40%',
      itemStyle: { color: '#8C6B94' },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(140,107,148,0.4)' } },
      data: [7.0, 4.9, 6.0]
    },
    {
      name: '肿瘤',
      type: 'bar',
      stack: 'total',
      barWidth: '40%',
      itemStyle: {
        color: '#B4A0C8',
        borderRadius: [6, 6, 0, 0]
      },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(180,160,200,0.4)' } },
      label: {
        show: true,
        position: 'top',
        formatter: function(params) {
          var totals = [49, 55.4, 41.7];
          return totals[params.dataIndex] + '%';
        },
        fontSize: 13,
        fontWeight: '700',
        color: '#4a3a50'
      },
      data: [37, 48, 30]
    }
  ]
};

chart.setOption(option);
window.addEventListener('resize', function(){ chart.resize(); });
</script>
</body>
</html>
