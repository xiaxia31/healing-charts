<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性别就诊患者占比</title>
<style>
  html,body{margin:0;padding:0;background:transparent;}
  #chart-wrap{width:100%;height:200px;position:relative;}
  svg{display:block;}
  .bar-side{cursor:pointer;transition:all 0.3s ease;}
  .dim{opacity:0.25;}
  .tooltip{
    position:absolute;padding:8px 12px;background:rgba(30,20,30,0.92);color:#fff;
    font-size:12px;border-radius:6px;pointer-events:none;opacity:0;
    transition:opacity 0.2s;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    z-index:10;line-height:1.5;white-space:nowrap;
  }
  .tooltip .t-title{font-weight:700;font-size:13px;margin-bottom:2px;}
</style>
</head>
<body style="background:transparent;">
<div id="chart-wrap">
  <svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 女性玫红色系渐变 -->
      <linearGradient id="gradF" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E88A9A"/>
        <stop offset="100%" stop-color="#C87486"/>
      </linearGradient>
      <!-- 男性紫色系渐变 -->
      <linearGradient id="gradM" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#B4A0C8"/>
        <stop offset="100%" stop-color="#8C6B94"/>
      </linearGradient>
    </defs>

    <!-- ===== 主体条 ===== -->
    <!-- 女性侧（左） 59.6% = 250.32px -->
    <g class="bar-side" id="sideF">
      <!-- 底层阴影 -->
      <rect x="20" y="90" width="250" height="44" rx="22" ry="22" fill="#F2C8D0" opacity="0.4"/>
      <!-- 中层 -->
      <rect x="20" y="86" width="250" height="48" rx="24" ry="24" fill="url(#gradF)"/>
      <!-- 顶层高光 -->
      <rect x="26" y="80" width="238" height="10" rx="5" ry="5" fill="#fff" opacity="0.25"/>
      <!-- 文字 -->
      <text x="55" y="105" text-anchor="start" fill="#fff" font-size="16" font-weight="800"
            font-family="PingFang SC, Microsoft YaHei, sans-serif">59.60%</text>
      <text x="55" y="124" text-anchor="start" fill="#fff" font-size="11" font-weight="600"
            font-family="PingFang SC, Microsoft YaHei, sans-serif" opacity="0.9">女性</text>
    </g>

    <!-- 男性侧（右） 40.4% = 169.68px -->
    <g class="bar-side" id="sideM">
      <!-- 底层阴影 -->
      <rect x="270" y="90" width="130" height="44" rx="22" ry="22" fill="#D1C2E0" opacity="0.4"/>
      <!-- 中层 -->
      <rect x="270" y="86" width="130" height="48" rx="24" ry="24" fill="url(#gradM)"/>
      <!-- 顶层高光 -->
      <rect x="276" y="80" width="118" height="10" rx="5" ry="5" fill="#fff" opacity="0.25"/>
      <!-- 文字 -->
      <text x="350" y="105" text-anchor="middle" fill="#fff" font-size="16" font-weight="800"
            font-family="PingFang SC, Microsoft YaHei, sans-serif">40.40%</text>
      <text x="350" y="124" text-anchor="middle" fill="#fff" font-size="11" font-weight="600"
            font-family="PingFang SC, Microsoft YaHei, sans-serif" opacity="0.9">男性</text>
    </g>

    <!-- 中央分割圆形节点 -->
    <circle cx="270" cy="110" r="26" fill="#fff" opacity="0.95"/>
    <circle cx="270" cy="110" r="18" fill="none" stroke="#C87486" stroke-width="3"/>
    <circle cx="270" cy="110" r="8" fill="#8C6B94"/>

    <!-- 底部标注 -->
    <text x="210" y="175" text-anchor="middle" fill="#665555" font-size="13"
          font-family="PingFang SC, Microsoft YaHei, sans-serif">
      女性就诊患者比男性多
      <tspan fill="#C87486" font-weight="800"> 19.2% </tspan>
    </text>
  </svg>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
  const wrap = document.getElementById('chart-wrap');
  const tooltip = document.getElementById('tooltip');
  const sideF = document.getElementById('sideF');
  const sideM = document.getElementById('sideM');

  function showTip(e, title, val){
    tooltip.innerHTML = `<div class="t-title">${title}</div>就诊患者占比：${val}`;
    tooltip.style.opacity = '1';
    const rect = wrap.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
  }
  function hideTip(){ tooltip.style.opacity = '0'; }

  sideF.addEventListener('mouseenter', e=>{
    sideM.classList.add('dim');
    sideF.style.transform = 'translateY(-2px)';
    showTip(e, '女性', '59.60%');
  });
  sideF.addEventListener('mousemove', e=>{
    const rect = wrap.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
  });
  sideF.addEventListener('mouseleave', ()=>{
    sideM.classList.remove('dim');
    sideF.style.transform = 'translateY(0)';
    hideTip();
  });

  sideM.addEventListener('mouseenter', e=>{
    sideF.classList.add('dim');
    sideM.style.transform = 'translateY(-2px)';
    showTip(e, '男性', '40.40%');
  });
  sideM.addEventListener('mousemove', e=>{
    const rect = wrap.getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 10) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 10) + 'px';
  });
  sideM.addEventListener('mouseleave', ()=>{
    sideF.classList.remove('dim');
    sideM.style.transform = 'translateY(0)';
    hideTip();
  });
</script>
</body>
</html>
