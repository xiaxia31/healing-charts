<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>首诊误诊率横向条形图</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:transparent;}
    #chart{width:100%;height:100%;}
  </style>
</head>
<body style="background:transparent;">
<div id="chart"></div>
<script>
var dom = document.getElementById('chart');
var myChart = echarts.init(dom, null, {
  renderer: 'canvas',
  backgroundColor: 'transparent'
});

var colors = ['#C87486', '#8C6B94', '#B4A0C8'];
var data = [
  { name: '子宫内膜异位症', value: 65, itemStyle: { color: colors[0] } },
  { name: '纤维肌痛', value: 87, itemStyle: { color: colors[1] } },
  { name: '慢性盆腔痛', value: 70, itemStyle: { color: colors[2] } }
];

var option = {
  backgroundColor: 'transparent',
  tooltip: {
    trigger: 'axis',
    axisPointer: { type: 'shadow' },
    formatter: function(params) {
      return params[0].name + '<br/>首诊误诊率：' + params[0].value + '%';
    }
  },
  grid: {
    left: 140,
    right: 80,
    top: 30,
    bottom: 30
  },
  xAxis: {
    type: 'value',
    max: 100,
    axisLine: { show: false },
    axisTick: { show: false },
    splitLine: { lineStyle: { color: 'rgba(200,200,200,0.15)' } },
    axisLabel: {
      color: '#999',
      fontSize: 11,
      formatter: '{value}%'
    }
  },
  yAxis: {
    type: 'category',
    data: data.map(function(d){return d.name;}),
    axisLine: { show: false },
    axisTick: { show: false },
    axisLabel: {
      color: '#333',
      fontSize: 14,
      fontWeight: '500',
      fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif'
    }
  },
  series: [
    {
      type: 'bar',
      data: data,
      barWidth: 28,
      itemStyle: {
        borderRadius: [0, 14, 14, 0]
      },
      label: {
        show: true,
        position: 'right',
        formatter: '{c}%',
        fontSize: 15,
        fontWeight: '700',
        fontFamily: 'Arial, sans-serif',
        color: '#333',
        offset: [8, 0]
      },
      emphasis: {
        itemStyle: {
          shadowBlur: 12,
          shadowColor: 'rgba(0,0,0,0.25)'
        }
      }
    }
  ]
};

myChart.setOption(option);

window.addEventListener('resize', function () {
  myChart.resize();
});
</script>
</body>
</html>
